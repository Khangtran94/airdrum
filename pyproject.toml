[project]
name = "airdrum"
version = "0.1.0"
description = "Air-drum rhythm game using MediaPipe hand tracking (webcam / iVCam input)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.14",
    "numpy>=1.26.0",
    "pygame>=2.5.0",
]

[project.scripts]
airdrum = "airdrum.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airdrum"]
